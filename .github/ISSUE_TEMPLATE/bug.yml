name: Bug report
description: Something in Bonfire is not working
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Two quick things first — they answer most reports before anyone has to ask.

        **The switcher is not appearing at all?** Check **Dashboard → Plugins → Bonfire →
        Advanced → Client script** first. If it says a restart is pending: on Docker the
        dashboard's Restart button often does not restart the process. Restart the
        container.

        **The page says nothing about `index.html`?** That is correct. Since 1.5 Bonfire
        adds its script as the page is served and leaves `index.html` alone. A file with
        no Bonfire tags in it is healthy.

  - type: input
    id: version
    attributes:
      label: Bonfire version
      description: Dashboard → Plugins → Bonfire, top right. Include `-beta` if it is there.
      placeholder: "1.5.4-beta"
    validations:
      required: true

  - type: textarea
    id: script-status
    attributes:
      label: Client script status
      description: >
        Dashboard → Plugins → Bonfire → Advanced → Client script. Copy the status line
        and the delivery method. This says whether the plugin is reaching the browser at
        all, which decides whether anything else in the report is even possible.
      placeholder: "Serving live · 412 pages served · no errors"
    validations:
      required: true

  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin server version
      placeholder: "10.11.7"
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How the server is installed
      placeholder: "Docker (linuxserver image) / Debian package / Windows / Unraid"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Where you saw it
      description: >
        The app and the device. On a television, say which — Bonfire runs inside your
        server's web client, and the browser engine on a 2020 TV is years behind a desktop
        one, so this changes what is even possible.
      placeholder: "LG webOS (CX, 2020) / Firefox on Windows / Jellyfin Android app"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or photo
      description: >
        Optional, and worth more than any description for anything visual. A phone photo
        of a television is completely fine — two reports in a row were diagnosed from one.
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: >
        Optional. On desktop, F12 → Console, and copy anything red mentioning
        `ProfilesPlugin` or `profiles.js`. Skip this on a TV.
      render: text
    validations:
      required: false
