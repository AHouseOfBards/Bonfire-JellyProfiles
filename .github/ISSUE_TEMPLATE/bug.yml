name: Bug report
description: Something in Bonfire is not working
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Check these first.

        **The switcher is not appearing at all?** Open **Dashboard → Plugins → Bonfire →
        Troubleshoot → Advanced → Client script**. If it says a restart is pending: on Docker the
        dashboard's Restart button often does not restart the process. Restart the
        container.

        **No Bonfire tags in `index.html`?** That is normal. Bonfire adds its script as the
        page is served and leaves `index.html` alone.

  - type: input
    id: version
    attributes:
      label: Bonfire version
      description: Top right of **Dashboard → Plugins → Bonfire**. Include `-beta` if it is there.
      placeholder: "1.5.4-beta"
    validations:
      required: true

  - type: textarea
    id: script-status
    attributes:
      label: Client script status
      description: >
        **Dashboard → Plugins → Bonfire → Troubleshoot → Advanced → Client script**. Copy the status line
        and the delivery method. It shows whether the plugin reaches the browser.
      placeholder: "The script is working: 412 pages served."
    validations:
      required: true

  - type: input
    id: jellyfin
    attributes:
      label: Jellyfin server version
      placeholder: "10.11.7"
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How the server is installed
      placeholder: "Docker (linuxserver image) / Debian package / Windows / Unraid"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Where you saw it
      description: >
        The app and the device. On a TV, give the model. Old TV browsers limit what
        Bonfire can do.
      placeholder: "LG webOS (CX, 2020) / Firefox on Windows / Jellyfin Android app"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or photo
      description: >
        Optional. A phone photo of a TV is fine.
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: >
        Optional. On desktop, press F12, open Console, and copy anything red mentioning
        `ProfilesPlugin` or `profiles.js`. Skip this on a TV.
      render: text
    validations:
      required: false
