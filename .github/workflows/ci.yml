name: CI

# Until now the only workflow here ran on tags, so a pull request got no build, no syntax
# check and no translation check at all. 1.5.2 shipped a client script that threw on
# startup and nothing noticed, because the file was still valid JavaScript.
on:
  pull_request:
  push:
    branches: [main, beta]

# Read-only: nothing in this workflow writes to the repository, so its token should not
# be able to.
permissions:
  contents: read

# A newer push to the same ref makes the older run's result worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Both, because the plugin multi-targets. Jellyfin 10.11.x runs on .NET 9 and 12.0
      # runs on .NET 10, and the C# harnesses run on whichever runtime the build they are
      # loading was compiled for — a net9 harness cannot load a net10 assembly.
      - name: Setup .NET 9 and 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Necessary but NOT sufficient — this passed against the 1.5.2 defect, which was
      # valid JavaScript that threw on the first call. tests/run.sh is what catches that.
      - name: Syntax check the client script
        run: node --check Web/profiles.js

      # Builds the plugin (Release, -warnaserror, both frameworks) and runs every
      # harness, JS and C#. Same command a maintainer runs locally, so CI and the desk
      # cannot disagree about what "the tests pass" means.
      # The C# half runs against net9.0, which is the build that ships.
      - name: Run the test suite
        run: bash tests/run.sh

      # And again against the other build. net9.0 is what ships — it is the only one of
      # the two that loads on both a 10.11 and a 12.0 server — but a build nobody has ever
      # loaded is not a working build, so the net10.0 assembly is loaded and reflected on
      # rather than merely compiled. When Jellyfin drops the .NET 9 runtime, this is the
      # step that will already have been passing for months.
      - name: Run the C# harnesses against the .NET 10 build
        run: bash tests/run.sh cs10

      # The plugin compiles against Jellyfin 10.11.5, so a green build says nothing about the
      # servers it runs on. This resolves every Jellyfin member the built DLL references
      # against the newest 10.11 and against 12.0. Its own step because it restores those
      # packages from NuGet (network), which tests/run.sh must not need.
      - name: Check the plugin against newer Jellyfin
        run: SKIP_BUILD=1 bash tests/binchk.sh

      # Contributors are told to run this before opening a PR (Web/i18n/README.md).
      # Nothing enforced it, so the first person to forget shipped a broken catalogue.
      - name: Validate translations
        run: node Web/i18n/validate.js
