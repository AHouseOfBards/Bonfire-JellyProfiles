name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The default token; `permissions: contents: write` above is what lets it push
          # the manifest commit. Not a request for a separate token.
          token: ${{ secrets.GITHUB_TOKEN }}

      # Both, because the plugin multi-targets net9.0 and net10.0. Only the net9.0
      # output is packaged below; net10.0 is built so that it cannot rot unnoticed
      # between the day it is needed and now.
      - name: Setup .NET 9 and 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # The same three commands ci.yml runs, ahead of anything that builds, packages or
      # publishes. A tag can be cut from a commit CI never saw, or from one whose CI run
      # was red and ignored; before this, nothing here would have noticed. Any failure
      # stops the release before an artifact exists. tests/js/buildtargets.js fails if
      # these steps go missing, lose their place, or are made optional.
      - name: Run the test suite
        run: bash tests/run.sh

      - name: Run the C# harnesses against the .NET 10 build
        run: bash tests/run.sh cs10

      - name: Validate translations
        run: node Web/i18n/validate.js

      # CI's other check. tests/run.sh has already built the plugin, so binchk reads that
      # DLL (SKIP_BUILD) and resolves its Jellyfin members against 10.11 and 12.x. The
      # shared-library copy check is also inside run.sh; it is named here as well so that
      # dropping it from the runner cannot quietly drop it from a release.
      - name: Check the plugin against newer Jellyfin
        run: SKIP_BUILD=1 bash tests/binchk.sh

      - name: Check the vendored Campground.Shared copy
        run: sh Campground.Shared/check-shared.sh

      - name: Build (Release)
        run: dotnet build -c Release

      # net9.0 DELIBERATELY, and it is the one line that decides what every user installs.
      #
      # The build produces net9.0 and net10.0. Only the net9.0 assembly loads on BOTH a
      # 10.11.x server (.NET 9) and a 12.0 server (.NET 10 — the runtime accepts a net9
      # assembly, confirmed on live hardware from 1.6.0.1 onward). A net10.0 assembly
      # would install on 12.0 and fail to load on 10.11, and `targetAbi` cannot express
      # the difference, because it filters on the Jellyfin version rather than the runtime.
      # One artifact, one manifest entry, both servers.
      #
      # Change this to net10.0 only when 10.11.x support is being dropped, and add the
      # matching targetAbi bump in the same commit.
      - name: Package DLL into zip
        run: |
          mkdir -p dist
          zip -j dist/Jellyfin.Profiles.zip bin/Release/net9.0/Jellyfin.Profiles.dll

      - name: Compute MD5 checksum
        id: checksum
        run: |
          echo "md5=$(md5sum dist/Jellyfin.Profiles.zip | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "Checksum: $(md5sum dist/Jellyfin.Profiles.zip | awk '{print $1}')"

      - name: Extract version from csproj, cross-check the tag, pick the channel
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep '<Version>' Jellyfin.Profiles.csproj | sed 's/.*<Version>\(.*\)<\/Version>/\1/' | tr -d '[:space:]')
          INFO=$(grep '<InformationalVersion>' Jellyfin.Profiles.csproj | sed 's/.*<InformationalVersion>\(.*\)<\/InformationalVersion>/\1/' | tr -d '[:space:]')
          # Jellyfin's manifest wants a four-part version. A three-part csproj version is
          # padded; a four-part one is already there. Padding unconditionally turned
          # 1.6.0.1 into 1.6.0.1.0, which Version.TryParse rejects and which matches no
          # entry, so the run failed at the manifest lookup with a confusing message
          # about a missing entry that was in fact present.
          case "$VERSION" in
            *.*.*.*) FULL="${VERSION}" ;;
            *.*.*)   FULL="${VERSION}.0" ;;
            *)
              echo "::error::<Version>${VERSION}</Version> is not three or four parts."
              exit 1 ;;
          esac
          TAG="${GITHUB_REF_NAME#v}"

          # The tag drives the release URL; the csproj version drives which manifest entry
          # gets the checksum. If they drift, the workflow would happily stamp the checksum
          # onto the WRONG entry and publish a release whose manifest entry is never updated.
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v${TAG} does not match <Version>${VERSION}</Version> in Jellyfin.Profiles.csproj."
            echo "::error::Bump the csproj version and re-tag so the manifest entry and release URL agree."
            exit 1
          fi

          # InformationalVersion is the only place a pre-release label can live, because
          # Jellyfin requires a purely numeric assembly version. It decides which manifest
          # a build lands in: the stable manifest on main is a curated list of milestones
          # that everybody's Jellyfin polls, so a beta pushed there would be offered to
          # every install as an upgrade.
          #
          # Any label after a '-' is a pre-release and routes to beta, not only the three
          # spellings once listed: "1.9.1-preview" matched none of them and went to stable.
          # Beta is the safe side of a mistake, since nobody is offered it unasked. A
          # missing InformationalVersion fails instead of guessing stable.
          if [ -z "$INFO" ]; then
            echo "::error::<InformationalVersion> is missing from Jellyfin.Profiles.csproj; it decides the channel."
            exit 1
          fi
          case "$INFO" in
            *-*)
              CHANNEL="beta"; BRANCH="beta"; PRERELEASE="true"; LATEST="false" ;;
            *)
              CHANNEL="stable"; BRANCH="main"; PRERELEASE="false"; LATEST="true" ;;
          esac

          echo "version=${FULL}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "make_latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "Detected version: ${FULL} (tag v${TAG}, informational ${INFO})"
          echo "Channel: ${CHANNEL} — manifest lives on the '${BRANCH}' branch"

      # Everything that can refuse a release, before anything is published: the manifest
      # entry exists once, is not in the other channel, and does not clash on checksum.
      # Nothing is written to the repository here. The stamp and the push come after the
      # release, in the step below it.
      - name: Check the channel manifest entry and write the release notes
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          C="${{ steps.checksum.outputs.md5 }}"
          BRANCH="${{ steps.version.outputs.branch }}"

          if [ -z "$C" ]; then
            echo "::error::Checksum step produced an empty value."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Work against the channel branch's manifest rather than the tag's. The tag was
          # cut from main, so on a beta release the manifest checked out here is the wrong
          # file entirely. dist/ is untracked and survives the switch.
          # Explicit refspec: actions/checkout configures remote.origin.fetch for the ref it
          # checked out, which on a tag push does not include branch heads. Without this the
          # remote-tracking ref below would not exist.
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -B ci-manifest "origin/${BRANCH}"

          # A version must live in exactly one manifest. Both files declare the same
          # plugin GUID, so Jellyfin merges them for anyone subscribed to both and shows
          # every duplicated version twice. That is cosmetic only while the two copies
          # agree — and they diverge the moment a release stamps one and not the other,
          # at which point the user is picking blind between a working entry and a
          # placeholder checksum. Releasing 1.4.0 to stable did exactly that on
          # 2026-08-23, because its entry was still sitting in the beta manifest too.
          if [ "$BRANCH" = "main" ]; then OTHER_BRANCH="beta"; else OTHER_BRANCH="main"; fi
          git fetch origin "+refs/heads/${OTHER_BRANCH}:refs/remotes/origin/${OTHER_BRANCH}"
          OTHER_COUNT=$(git show "origin/${OTHER_BRANCH}:manifest.json" \
            | jq --arg v "$V" '[.[0].versions[] | select(.version == $v)] | length')
          if [ "$OTHER_COUNT" -ne 0 ]; then
            echo "::error::${V} is also in the manifest on '${OTHER_BRANCH}'."
            echo "::error::Only the '${BRANCH}' manifest gets a checksum here, so the other copy"
            echo "::error::would keep its placeholder and offer users an install that fails."
            echo "::error::Remove the ${V} entry from '${OTHER_BRANCH}' and re-run."
            exit 1
          fi

          # Fail loudly when the entry is missing. jq's map() silently matches nothing and
          # exits 0, which is how releases shipped with an all-zeros placeholder checksum
          # and could not be installed.
          COUNT=$(jq --arg v "$V" '[.[0].versions[] | select(.version == $v)] | length' manifest.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::manifest.json on '${BRANCH}' has no versions[] entry for ${V}."
            echo "::error::Add the entry (changelog, targetAbi, sourceUrl, timestamp) to that branch before tagging."
            echo "::error::Existing versions: $(jq -r '[.[0].versions[].version] | join(", ")' manifest.json)"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::manifest.json on '${BRANCH}' has ${COUNT} entries for ${V}. Remove the duplicates."
            exit 1
          fi

          # A checksum that already belongs to another version means this release is
          # byte-identical to one that already shipped — the artifact was rebuilt from an
          # unchanged tree, or the wrong zip was uploaded. Either way the release notes
          # describe changes that are not in the file.
          #
          # 1.1.2, 1.1.4 and 1.1.6 all carry 0b6481f7f56de24f3c9757d67a73f181. Three
          # releases, three sets of notes, one binary. Nothing in the pipeline noticed,
          # and nothing could have: every other check here asks whether the checksum was
          # written, never whether it is new.
          #
          # Both manifests are searched. The same artifact appearing under a beta version
          # and a stable one is the normal, correct outcome of promoting a beta, so a match
          # is only fatal within the channel being released to.
          CLASH=$(jq -r --arg c "$C" --arg v "$V" \
            '[.[0].versions[] | select(.checksum == $c and .version != $v) | .version] | join(", ")' \
            manifest.json)
          if [ -n "$CLASH" ]; then
            echo "::error::${V} has the same checksum as ${CLASH} in the '${BRANCH}' manifest."
            echo "::error::The build is byte-identical to a release that already shipped, so"
            echo "::error::whatever the release notes describe is not in this artifact."
            echo "::error::Checksum: ${C}"
            exit 1
          fi

          # The notes come from the entry just validated, written to a file. They went
          # through a GITHUB_OUTPUT heredoc with a fixed EOF delimiter, so a changelog
          # containing a line that said EOF would have ended the value early.
          jq -r --arg v "$V" '.[0].versions[] | select(.version == $v) | .changelog' \
             manifest.json > "$RUNNER_TEMP/release-notes.md"

      # The release, asset included, goes out BEFORE the manifest is stamped and pushed.
      # The other order pointed every subscribed server at a download that did not exist
      # yet, and left a manifest naming a checksum for a release that then failed to
      # publish. Now a failure here pushes nothing.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/Jellyfin.Profiles.zip
          body_path: ${{ runner.temp }}/release-notes.md
          # A pre-release must not become the repo's "Latest" — that badge is what people
          # land on from the releases page, and the stable manifest does not offer it.
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}

      - name: Stamp the checksum and push the channel manifest
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          C="${{ steps.checksum.outputs.md5 }}"
          BRANCH="${{ steps.version.outputs.branch }}"

          # Still on the ci-manifest branch the previous step checked out.
          jq --arg v "$V" --arg c "$C" \
             '.[0].versions |= map(if .version == $v then .checksum = $c else . end)' \
             manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json

          # Confirm the value actually landed, rather than trusting the edit.
          WRITTEN=$(jq -r --arg v "$V" '.[0].versions[] | select(.version == $v) | .checksum' manifest.json)
          if [ "$WRITTEN" != "$C" ]; then
            echo "::error::Checksum write failed: manifest has '${WRITTEN}', expected '${C}'."
            exit 1
          fi
          case "$WRITTEN" in
            *[!0]*) : ;;
            *) echo "::error::Checksum is all zeros — refusing to publish an uninstallable release."; exit 1 ;;
          esac

          # The beta feed is the newest three entries; every older build stays downloadable
          # from its GitHub release. Everyone on the beta repository fetches this file, and
          # the plugin page lists every entry in it. Sorted by version first so it keeps the
          # newest three whatever order the file is in. Beta only: main's manifest is the
          # stable milestone list, and trimming it would withdraw releases people are on.
          # tests/js/betafeed.js fails if this block stops pruning or runs on the wrong channel.
          if [ "$BRANCH" = "beta" ]; then
            jq '.[0].versions |= (sort_by(.version | split(".") | map(tonumber)) | reverse | .[:3])' \
               manifest.json > manifest.tmp.json
            mv manifest.tmp.json manifest.json
            if [ "$(jq --arg v "$V" '[.[0].versions[] | select(.version == $v)] | length' manifest.json)" -ne 1 ]; then
              echo "::error::${V} is not among the newest three entries; refusing to prune it out of the beta feed."
              exit 1
            fi
            echo "Beta feed now: $(jq -r '[.[0].versions[].version] | join(", ")' manifest.json)"
          fi

          echo "Manifest entry for ${V} on '${BRANCH}':"
          jq --arg v "$V" '.[0].versions[] | select(.version == $v)' manifest.json

          if git diff --quiet -- manifest.json; then
            echo "Checksum already correct on ${BRANCH}; nothing to push."
            exit 0
          fi

          git add manifest.json
          git commit -m "ci: update manifest checksum for ${{ github.ref_name }} [skip ci]"

          # The branch may have advanced since the tag was cut. Rebase and retry rather
          # than failing the release over a race with another push.
          for i in 1 2 3; do
            if git push origin HEAD:"$BRANCH"; then exit 0; fi
            echo "Push rejected (attempt $i) — refreshing ${BRANCH} and retrying."
            git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git rebase "origin/${BRANCH}"
          done
          echo "::error::Could not push the manifest update to ${BRANCH}."
          exit 1

      # End-to-end check against what users actually install: re-download the published
      # asset from the release URL in the manifest and confirm its MD5 matches the
      # published checksum. Catches a stale/failed manifest push or a re-zipped asset.
      - name: Verify published asset matches manifest checksum
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          BRANCH="${{ steps.version.outputs.branch }}"

          # Read the manifest from the pushed git ref, not from raw.githubusercontent.com:
          # that is a CDN, and it can serve the previous file for minutes after a push.
          # git fetch asks the repository itself.
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git show "origin/${BRANCH}:manifest.json" > published-manifest.json

          EXPECTED=$(jq -r --arg v "$V" '.[0].versions[] | select(.version == $v) | .checksum' published-manifest.json)
          SOURCE=$(jq -r --arg v "$V" '.[0].versions[] | select(.version == $v) | .sourceUrl' published-manifest.json)
          echo "Published manifest checksum: ${EXPECTED}"
          echo "Published sourceUrl:         ${SOURCE}"

          if [ -z "$EXPECTED" ] || [ "$EXPECTED" = "null" ] || [ "$EXPECTED" = "00000000000000000000000000000000" ]; then
            echo "::error::Published manifest has no valid checksum for ${V} — the manifest push did not land."
            exit 1
          fi

          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsSL -H "Cache-Control: no-cache, no-store" -H "Pragma: no-cache" "$SOURCE" -o published.zip; then break; fi
            echo "Release asset not available yet (attempt $i); retrying in 5s..."
            sleep 5
          done

          ACTUAL=$(md5sum published.zip | awk '{print $1}')
          echo "Downloaded asset MD5:        ${ACTUAL}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checksum mismatch — users will get 'checksum mismatch' on install."
            echo "::error::manifest=${EXPECTED} asset=${ACTUAL}"
            exit 1
          fi
          echo "✅ Published asset matches the manifest checksum. Install will succeed."

      # Campground-Jellyfin is the one link for all the plugins. It copies the newest stable
      # entry from main's manifest, so it hears only once that entry and its download are
      # proven above, and never about a beta: it offers what it lists to everyone. The token
      # is a fine-grained one limited to that repository. The release is already public at
      # this point, so a dead token warns instead of failing it; the Run workflow button in
      # Campground does the same job by hand.
      - name: Tell Campground a stable version is out
        if: steps.version.outputs.channel == 'stable'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CAMPGROUND_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CAMPGROUND_TOKEN is not set. Run Update manifest in Campground-Jellyfin by hand."
            exit 0
          fi
          gh api repos/AHouseOfBards/Campground-Jellyfin/dispatches --method POST \
            -f event_type=plugin-released \
            -f "client_payload[plugin]=Bonfire" \
            -f "client_payload[version]=$V"
