# Settings for the Campground kit tools. Bonfire uses only tools/binchk.sh from the kit;
# tools/binchk.sh, tools/binchk/Program.cs, binchk.csproj and pkgs/pkgs.csproj are copied
# byte for byte from Campground-Coordination methodology/kit (bddcceb). Change them there.
PROJECT=Jellyfin.Profiles.csproj
# net9.0 is the build that ships (see release.yml), so it is the one checked.
BINCHK_DLL=bin/Release/net9.0/Jellyfin.Profiles.dll
# The lowest release targetAbi allows, the newest 10.11, the first 12.x, and the newest on NuGet.
BINCHK_VERSIONS="10.11.0 10.11.11 12.0.0 latest"
