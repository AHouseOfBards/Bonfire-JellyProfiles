<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonfire screens</title>
<style>
    /* What jellyfin-web gives every page that the switcher leans on: the icon font and a
       dark body. Nothing of Bonfire's. */
    @font-face { font-family: 'Material Icons'; font-style: normal; font-weight: 400; src: url(/fixture/material-icons.woff2) format('woff2'); }
    .material-icons { font-family: 'Material Icons'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
        letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal;
        direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
    html, body { margin: 0; background: #101010; color: #fff; }
    /* jellyfin-web's root size, which every rem in the switcher is a share of
       (release-10.11.z). site.scss: Arial, line-height 1.35. A phone or tablet loads
       fonts.scss: 93%, and 90% under layout-mobile, which is on <html>. A TV browser
       (webOS, Tizen: browser.tv and not Android) loads fonts.sized.scss instead: 20px from
       720px tall, 27px from 1000px. Leave these out and a TV shot is drawn at 16px when
       the television draws it at 27. */
    html { font-family: Arial, Helvetica, sans-serif; line-height: 1.35; -webkit-font-smoothing: antialiased; font-size: 93%; }
    html.layout-mobile { font-size: 90%; }
    @media all and (min-height: 720px) { html.layout-tv { font-size: 20px; } }
    @media all and (min-height: 1000px) { html.layout-tv { font-size: 27px; } }
    /* A caret and a focus ring moving between two shots is a difference nobody made. */
    * { caret-color: transparent !important; }
</style>
</head>
<body>
<script src="/scenes.js"></script>
<script src="/bonfire.js"></script>
<script>window.__scene();</script>
</body>
</html>
